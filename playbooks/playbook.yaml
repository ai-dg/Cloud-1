- name: Cloud-I
  hosts: webservers
  roles:
    - geerlingguy.docker
  tasks:
    - name: install curl
      ansible.builtin.apt:
        name: curl
        state: present

    - name: install make
      ansible.builtin.apt:
        name: make
        state: present

    - name: copy hosts file
      ansible.builtin.copy:
        src: "../conf/hosts"
        dest: "/etc/hosts"
        owner: root
        group: root
        mode: '644'
      become: true

    - name: pull sources
      ansible.builtin.git:
        repo: https://github.com/ChristopheAlborPirame/cloud-I-app.git
        dest: ~/cloudI

    - name: Copy dump
      ansible.builtin.copy:
        src: ~/cloudI/srcs/requirements/mysql/dump/dump.sql
        dest: /root/dump.sql
        remote_src: yes
      tags: [dump]

    - name: Replace hosts in dump
      ansible.builtin.replace:
        path: /root/dump.sql
        regexp: 'https?://localhost'
        replace: "https://{{ domain_name }}"
      tags: [dump]

    - name: Generate .env from template
      ansible.builtin.template:
        src: "../conf/.env.j2"
        dest: /root/cloudI/srcs/.env
      tags: [config]

      
    - name: run make
      ansible.builtin.make:
        chdir: "~/cloudI"
        target: "re"
      tags: [build]







